<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 边境传说 — Border Legends</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <!-- 游戏容器 -->
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- HUD 覆盖层 -->
  <div id="hud">
    <div id="status-bars">
      <div class="bar-container hp-bar">
        <div class="bar-label">HP</div>
        <div class="bar-track">
          <div id="hp-fill" class="bar-fill hp-fill"></div>
        </div>
        <span id="hp-text" class="bar-text">100 / 100</span>
      </div>
      <div class="bar-container mp-bar">
        <div class="bar-label">MP</div>
        <div class="bar-track">
          <div id="mp-fill" class="bar-fill mp-fill"></div>
        </div>
        <span id="mp-text" class="bar-text">50 / 50</span>
      </div>
    </div>
    <div id="level-info" class="hidden">
      <span id="level-text">Lv.1</span>
      <span id="xp-bar-container">
        <div id="xp-fill" class="bar-fill xp-fill"></div>
      </span>
      <span id="xp-text" class="bar-text">0 / 100</span>
      <span id="gold-text" class="bar-text">💰 0</span>
    </div>
    <div id="quest-panel" class="hidden">
      <div class="quest-title">📜 当前任务</div>
      <div id="quest-list"></div>
    </div>
    <div id="minimap">
      <canvas id="minimap-canvas" width="150" height="150"></canvas>
    </div>
    <div id="controls-hint">
      <div>WASD — 移动</div>
      <div>鼠标 — 视角</div>
      <div>左键 — 攻击</div>
      <div>Shift — 冲刺</div>
      <div>空格 — 翻滚</div>
      <div>E — 互动</div>
    </div>
    <div id="quest-notification"></div>
    <div id="combat-log" class="hidden"></div>
  </div>

  <!-- 角色选择界面 -->
  <div id="character-select" class="overlay-screen">
    <div class="panel character-select-panel">
      <h1>🎮 边境传说</h1>
      <h2>Border Legends</h2>
      <p class="subtitle">选择你的角色，开始冒险</p>
      <div id="character-grid" class="character-grid"></div>
      <div id="selected-character-info" class="selected-info hidden"></div>
      <div class="button-group">
        <button id="start-btn" class="btn-primary" disabled>开始冒险</button>
      </div>
    </div>
  </div>

  <!-- 菜单面板 -->
  <div id="menu-overlay" class="overlay-screen hidden">
    <div class="panel">
      <h2>菜单</h2>
      <button class="menu-btn" id="btn-backpack">🎒 背包</button>
      <button class="menu-btn" id="btn-skills">✨ 技能</button>
      <button class="menu-btn" id="btn-map">🗺️ 地图</button>
      <button class="menu-btn" id="btn-save">💾 保存</button>
      <button class="menu-btn" id="btn-load">📂 读取</button>
      <button class="menu-btn" id="btn-quit">🚪 退出</button>
    </div>
  </div>

  <!-- 背包面板 -->
  <div id="backpack-panel" class="overlay-screen hidden">
    <div class="panel backpack-panel">
      <h2>🎒 背包</h2>
      <div id="inventory-grid" class="inventory-grid"></div>
      <button class="menu-btn" id="btn-backpack-close">关闭</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
